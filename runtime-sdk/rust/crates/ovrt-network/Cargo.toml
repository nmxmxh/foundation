[package]
name = "ovrt-network"
version = "0.1.0"
edition = "2021"
license-file.workspace = true
rust-version.workspace = true

# Opt-in, and depended on by nothing. `runtime-network` is a lane that a host
# asks for by name; nothing in the runtime reaches for it implicitly, and a
# build that does not want a network lane does not compile one.
#
# This crate uses std and libc for sockets, bounded racing, and deduplication.
# The unit registry separately uses arc-swap for immutable dispatch snapshots.
# A future QUIC dependency requires its own performance and maintenance evidence.

[features]
loom = ["dep:loom"]

[dependencies]
loom = { version = "0.7", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
