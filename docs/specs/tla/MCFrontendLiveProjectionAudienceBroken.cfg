\* Negative control: BrokenSpec authorizes delivery on tenant/domain/collection
\* only — the pre-audience read path — so a record belonging to another
\* audience becomes resident and AudienceScopeStable MUST be violated.
\* See MCFrontendLiveProjectionAudienceBroken.tla.
SPECIFICATION BrokenSpec

CONSTANTS
  Tenant = Tenant
  OtherTenant = OtherTenant
  Domain = Domain
  Collection = Collection
  Record = Record
  NULL = NULL
  Audience = Audience
  OtherAudience = OtherAudience

CONSTRAINT StateConstraint

INVARIANT AudienceScopeStable
