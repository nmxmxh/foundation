[package]
name = "{{PROJECT_NAME}}-native"
version = "0.1.0"
description = "{{PROJECT_NAME}} Foundation native shell"
authors = ["Ovasabi Studios"]
edition = "2021"

[lib]
name = "app_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
ovasabi-runtime-native = { path = "../../foundation/runtime-native/rust" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }

# Shipped mobile/desktop binaries: smallest size, no unwinding across the
# Swift/Kotlin FFI boundary (a panic aborts instead of unwinding into native
# frames), and no symbol table in the store artifact.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
