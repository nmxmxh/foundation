server {
    listen 80;
    server_name _;

    # Compression - Brotli
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm application/octet-stream;

    # Compression - Gzip (Fallback)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm application/octet-stream;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers. TLS is terminated upstream (this server listens
    # on :80), so HSTS is only honored by browsers once the response reaches them
    # over HTTPS at the edge; emitting it here is spec-safe on the plain-HTTP hop.
    # CSP is intentionally omitted: a Content-Security-Policy must be tuned to the
    # built app's real asset origins (a wrong one silently breaks the SPA), so it
    # lands per-app in Report-Only first, not in this shared template. None of the
    # headers below affect crawlability (that would be X-Robots-Tag, deliberately
    # absent). nginx does not inherit add_header into a location that sets its own,
    # so this block is repeated in every location below that adds headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Hashed Assets - Cache Forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
