# Generic CI Pipeline for Ovasabi Foundation Go Projects
# Copy to .github/workflows/ci.yml and customize PROJECT_NAME and test database name

name: CI Pipeline

on:
  push:
    branches: ["main", "develop", "staging"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  # Anchors Postgres version across templates (compose files, .env.example,
  # Dockerfile.postgres) via version-consistency checks. The services block
  # below cannot read this — the env context is unavailable there — so its
  # image tag is pinned separately; the consistency check keeps them equal.
  POSTGRES_VERSION: "18"
  # Customize these for your project
  PROJECT_NAME: "{{PROJECT_NAME}}"
  TEST_DB_NAME: "{{PROJECT_NAME}}_test"
  TEST_DB_HOST: localhost
  TEST_DB_PORT: "5432"
  TEST_DB_USER: postgres
  TEST_DB_PASSWORD: postgres
  TEST_REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        # The env context is unavailable inside services.* — GitHub evaluates
        # this block before job environment exists — so versions here are
        # pinned literally instead of referencing workflow-level env.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: "{{PROJECT_NAME}}_test"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        run: npm --prefix frontend install --no-audit --no-fund

      # Uncomment if your project uses protobuf
      # - name: Install protobuf dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y protobuf-compiler
      #     go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      #     go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      #     echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # - name: Generate protobuf code
      #   run: make proto

      - name: Install migration tool
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run database migrations
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ env.TEST_DB_PORT }}/${{ env.TEST_DB_NAME }}?sslmode=disable
        run: |
          make migrate-test

      - name: Run tests
        env:
          CI: true
          APP_ENV: test
          TEST_INFRA_REQUIRED: true
          TEST_REDIS_REQUIRED: true
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ env.TEST_DB_PORT }}/${{ env.TEST_DB_NAME }}?sslmode=disable
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ env.TEST_DB_PORT }}/${{ env.TEST_DB_NAME }}?sslmode=disable
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
          JWT_SECRET: test-secret-key
        run: |
          make test-unit
          make test-coverage
          make test-integration

      - name: Compile WASM runtime shim
        if: hashFiles('wasm/main.go') != ''
        run: make build-wasm

      - name: Build and test frontend
        if: hashFiles('frontend/package.json') != ''
        run: |
          make build-frontend
          make test-frontend

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m

      - name: Capture delivery metrics event
        if: always()
        run: node scripts/checks/ci_delivery_metrics.mjs --out delivery-metrics/ci-event.json

      - name: Upload delivery metrics event
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-metrics
          path: delivery-metrics/ci-event.json
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o ./bin/server ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: ./bin/server
          retention-days: 7

  # Publishes the service image to GHCR so deployment hosts pull a prebuilt
  # image instead of compiling on the box that runs it. A host-side build runs
  # Go, Rust, and Vite concurrently next to the live instance and OOM-kills
  # deploys on small machines. See docs/foundation_tooling.md, "Deployment
  # lane: host-build footprint".
  docker:
    name: Docker Build and Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the repository path, which GHCR requires.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
