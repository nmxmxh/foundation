include /etc/nginx/modules/*.conf;

worker_processes auto;
worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    log_format main_json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_method":"$request_method","request_uri":"$request_uri","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_response_time":"$upstream_response_time"}';
    access_log /dev/stdout main_json;
    error_log /dev/stderr warn;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    # Bound the request line and a single header field. The defaults are large
    # enough that one slow client can hold header memory.
    client_header_timeout 15s;
    client_body_timeout 300s;
    send_timeout 300s;
    reset_timedout_connection on;
    # Keep-alive budget. The default of 1000 requests lets one client hold a
    # worker connection indefinitely; 1000s caps the wall-clock too.
    keepalive_requests 1000;
    keepalive_time 1000s;
    client_max_body_size 50m;
    # Buffer the first part of a large upload in memory instead of spooling the
    # whole body to disk before the upstream is contacted.
    client_body_buffer_size 256k;
    large_client_header_buffers 4 16k;
    server_tokens off;

    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    # Below this length the compression header costs more than the saving.
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_types text/plain text/css text/xml application/json application/javascript application/wasm application/octet-stream application/rss+xml application/atom+xml image/svg+xml;

    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_dynamic on;
    brotli_types text/plain text/css text/xml application/json application/javascript application/wasm application/octet-stream application/rss+xml application/atom+xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # Rate-limit rejections must be distinguishable from a dead upstream:
    # 429 tells clients to back off; the default 503 reads as "server down"
    # and invites immediate retries that keep the limiter tripped.
    limit_req_status 429;
    # Bound concurrent connections per client as well as request rate. Rate
    # limiting alone does not stop a client holding many slow connections.
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Connection value for locations that may carry an upgrade. A plain request
    # needs an empty header, not "close": an empty value is what lets nginx keep
    # the upstream socket alive for the next request.
    map $http_upgrade $api_connection {
        default upgrade;
        '' '';
    }

    map $http_x_forwarded_proto $proxy_forwarded_proto {
        default $scheme;
        ~.+ $http_x_forwarded_proto;
    }

    # Response buffering shape for proxied JSON. Sizes are tuned for the
    # projection gateway payload class: large enough that a normal response never
    # spills to disk, and a temp-file cap so an oversized one cannot fill it.
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_max_temp_file_size 256m;

    include /etc/nginx/conf.d/*.conf;
}
